services:
  - type: web
    name: coach-jdc-platform
    runtime: node
    plan: starter
    domains:
      - coachjdc.org
      - www.coachjdc.org
    buildCommand: npm ci && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://coachjdc.org
      - key: DATABASE_URL
        fromDatabase:
          name: coach-jdc-platform-db
          property: connectionString
      - key: NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: GHL_PRIVATE_TOKEN
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      - key: GHL_LOCATION_NAME
        value: JDC Elite Society
      - key: GHL_AUTO_SYNC
        value: "true"
databases:
  - name: coach-jdc-platform-db
    databaseName: coach_jdc_platform
    user: coach_jdc_platform
    plan: free
