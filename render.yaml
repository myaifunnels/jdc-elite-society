services:
  - type: web
    name: coach-jdc-platform
    runtime: node
    plan: starter
    branch: main
    autoDeployTrigger: commit
    domains:
      - coachjdc.org
      - www.coachjdc.org
      - elite.coachjdc.org
    buildCommand: npm ci && npm run build
    startCommand: npx next start --hostname 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://coachjdc.org
      - key: DATABASE_URL
        fromDatabase:
          name: coach-jdc-platform-db
          property: connectionString
      - key: NEXT_PUBLIC_GOOGLE_MAPS_EMBED_KEY
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: GHL_API_KEY
        sync: false
      - key: GHL_LOCATION_ID
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      - key: NOTIFY_PHONE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: TEXTBEE_API_KEY
        sync: false
      - key: TEXTBEE_DEVICE_ID
        sync: false
databases:
  - name: coach-jdc-platform-db
    databaseName: coach_jdc_platform
    user: coach_jdc_platform
    plan: free
